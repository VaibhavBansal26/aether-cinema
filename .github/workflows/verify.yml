name: Verify Aether
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aether_test
          POSTGRES_PASSWORD: aether_test
          POSTGRES_DB: aether_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml
      - run: mvn -B -ntp verify
        working-directory: server
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/aether_test
          TEST_REDIS_HOST: localhost
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:auth
      - run: npm test
  recommendations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: recommender/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: recommender
      - run: python -m pytest -q
        working-directory: recommender
