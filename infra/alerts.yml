groups:
  - name: aether
    rules:
      - alert: AetherUnavailable
        expr: up{job="aether"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'API metrics endpoint unreachable or metrics credential expired'}
      - alert: AetherQueueErrors
        expr: increase(aether_jobs_poll_failures_total[5m]) > 3
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'Activity worker cannot poll the database'}
      - alert: AetherApiErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.01) > 0.01
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'API server error rate exceeds one percent'}
