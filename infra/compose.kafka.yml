# Local real Kafka integration overlay. Single broker is a development fixture, not HA.
services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx384m -Xms256m
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1']
      interval: 10s
      retries: 20
  api:
    environment:
      KAFKA_ENABLED: 'true'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_REPLICATION_FACTOR: 1
      KAFKA_PUBLISHER_ENABLED: 'false'
      KAFKA_CONSUMER_ENABLED: 'false'
      ADMISSION_ENABLED: 'true'
    depends_on:
      kafka: {condition: service_healthy}
  worker:
    environment:
      KAFKA_ENABLED: 'true'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_REPLICATION_FACTOR: 1
      KAFKA_PUBLISHER_ENABLED: 'true'
      KAFKA_CONSUMER_ENABLED: 'true'
      WORKER_ENABLED: 'false'
    depends_on:
      kafka: {condition: service_healthy}
