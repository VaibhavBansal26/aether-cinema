# Local infrastructure ONLY; not a highly available production deployment.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aether_test
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD}
      POSTGRES_DB: aether
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aether_test -d aether']
      interval: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports: ['127.0.0.1:6379:6379']
    restart: unless-stopped
volumes:
  postgres:
