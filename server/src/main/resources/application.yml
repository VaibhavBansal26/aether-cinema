server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 32KB
    threads:
      max: ${HTTP_MAX_THREADS:64}
      min-spare: 4
    accept-count: ${HTTP_ACCEPT_COUNT:64}
    max-connections: ${HTTP_MAX_CONNECTIONS:512}
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        max.block.ms: 3000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 100
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
  application:
    name: aether-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
      validation-timeout: 2000
      connection-init-sql: SET statement_timeout = '5s'
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: 200ms
      timeout: 200ms
  sql:
    init:
      mode: never
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER}
          jwk-set-uri: ${OIDC_JWKS_URL}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
app:
  paid-media-enabled: ${PAID_MEDIA_ENABLED:false}
  r2-media-origin: ${R2_MEDIA_ORIGIN:}
  r2-media-secret: ${R2_MEDIA_CAPABILITY_SECRET:}
  kafka-enabled: ${KAFKA_ENABLED:false}
  kafka-publisher-enabled: ${KAFKA_PUBLISHER_ENABLED:false}
  kafka-consumer-enabled: ${KAFKA_CONSUMER_ENABLED:false}
  kafka-replication-factor: ${KAFKA_REPLICATION_FACTOR:3}
  admission-enabled: ${ADMISSION_ENABLED:false}
  max-inflight: ${API_MAX_INFLIGHT:32}
  cf-signing-key-id: ${CF_SIGNING_KEY_ID:}
  cf-signing-private-key: ${CF_SIGNING_PRIVATE_KEY:}
  neon-auth-url: ${NEON_AUTH_URL:}
  oidc-algorithm: ${OIDC_ALGORITHM:RS256}
  worker-enabled: ${WORKER_ENABLED:false}
  recommendation-cache-enabled: ${RECOMMENDATION_CACHE_ENABLED:false}
  audience: ${OIDC_AUDIENCE}
  origin: ${APP_ORIGIN}
  stripe-secret-key: ${STRIPE_SECRET_KEY}
  stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  stripe-price-essential: ${STRIPE_PRICE_ESSENTIAL}
  stripe-price-cinema: ${STRIPE_PRICE_CINEMA}
  stripe-price-collective: ${STRIPE_PRICE_COLLECTIVE}
  cf-account-id: ${CF_ACCOUNT_ID}
  cf-stream-token: ${CF_STREAM_TOKEN}
  cf-customer-code: ${CF_CUSTOMER_CODE}
  recommender-url: ${RECOMMENDER_URL:}
  recommender-token: ${RECOMMENDER_SERVICE_TOKEN:}
